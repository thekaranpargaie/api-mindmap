<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Mindmap - Dashboard</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- D3.js for visualizations -->
    <script src="https://d3js.org/d3.v7.min.js" crossorigin="anonymous"></script>
    <!-- Chart.js for Stats Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/mindmap/mindmap/mindmap.css">
</head>
<body class="font-inter bg-gray-50 dark:bg-gray-900 transition-colors">
    <!-- Top Navigation Bar - Fixed Header -->
    <header class="api-mindmap-header">
        <div class="header-container">
            <div class="header-top">
                <div class="header-branding">
                    <div class="brand-icon">
                        <i data-lucide="brain-circuit" class="w-7 h-7"></i>
                    </div>
                    <div class="brand-text">
                        <h1 class="brand-title">API Mindmap</h1>
                        <p class="brand-subtitle">Interactive API Insight Dashboard</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="header-btn" title="Toggle theme (T)">
                        <i data-lucide="sun" class="w-5 h-5"></i>
                    </button>
                    <button id="fullscreenBtn" class="header-btn" title="Fullscreen (F)">
                        <i data-lucide="maximize" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <!-- View Tabs -->
            <nav class="header-tabs">
                <button class="view-tab active" data-view="mindmap">
                    <i data-lucide="network" class="w-4 h-4"></i>
                    <span>Mindmap</span>
                </button>
                <button class="view-tab" data-view="tree">
                    <i data-lucide="git-branch" class="w-4 h-4"></i>
                    <span>Tree</span>
                </button>
                <button class="view-tab" data-view="dependency">
                    <i data-lucide="git-merge" class="w-4 h-4"></i>
                    <span>Dependencies</span>
                </button>
                <button class="view-tab" data-view="table">
                    <i data-lucide="table" class="w-4 h-4"></i>
                    <span>Table</span>
                </button>
                <button class="view-tab" data-view="matrix">
                    <i data-lucide="grid-3x3" class="w-4 h-4"></i>
                    <span>Matrix</span>
                </button>
                <button class="view-tab" data-view="dashboard">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                    <span>Dashboard</span>
                </button>
                <!-- Database Analyzer Tab - Shown only when database analyzer is enabled -->
                <button class="view-tab hidden" data-view="database" id="databaseTab">
                    <i data-lucide="database" class="w-4 h-4"></i>
                    <span>Database</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Sticky Toolbar -->
    <div class="toolbar-container">
        <div class="toolbar-inner">
            <div class="toolbar-left">
                <button id="refreshBtn" class="toolbar-btn">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>Refresh</span>
                </button>
                <!-- Graph Controls (Mindmap, Tree, Dependency) -->
                <div id="graphControls" class="toolbar-group">
                    <div class="toolbar-divider"></div>
                    <button id="zoomInBtn" class="toolbar-btn">
                        <i data-lucide="zoom-in" class="w-4 h-4"></i>
                        <span>Zoom In</span>
                    </button>
                    <button id="zoomOutBtn" class="toolbar-btn">
                        <i data-lucide="zoom-out" class="w-4 h-4"></i>
                        <span>Zoom Out</span>
                    </button>
                    <button id="resetBtn" class="toolbar-btn">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        <span>Reset View</span>
                    </button>
                </div>
                <!-- Database Controls -->
                <div id="databaseControls" class="hidden toolbar-group">
                    <div class="toolbar-divider"></div>
                    <button id="dbViewToggle" class="toolbar-btn">
                        <i data-lucide="layout-list" class="w-4 h-4"></i>
                        <span id="dbViewToggleText">Detail View</span>
                    </button>
                </div>
                <!-- Table Controls -->
                <div id="tableControls" class="hidden toolbar-group">
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-search">
                        <i data-lucide="search" class="search-icon w-4 h-4"></i>
                        <input type="text" id="tableSearchInput" placeholder="Filter endpoints..." 
                            class="toolbar-input" />
                    </div>
                </div>
            </div>
            <div class="toolbar-right">
                <div class="export-dropdown">
                    <button id="exportBtn" class="toolbar-btn toolbar-btn-primary">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>Export</span>
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                    <div id="exportMenu" class="export-menu hidden">
                        <button data-export="png" class="export-item">
                            <i data-lucide="image" class="w-4 h-4"></i>
                            <span>Export as PNG</span>
                        </button>
                        <button data-export="svg" class="export-item export-svg-only">
                            <i data-lucide="file-image" class="w-4 h-4"></i>
                            <span>Export as SVG</span>
                        </button>
                        <button data-export="pdf" class="export-item">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                            <span>Export as PDF</span>
                        </button>
                        <button data-export="csv" class="export-item">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                            <span>Export as CSV</span>
                        </button>
                        <button data-export="json" class="export-item">
                            <i data-lucide="braces" class="w-4 h-4"></i>
                            <span>Export as JSON</span>
                        </button>
                        <button data-export="markdown" class="export-item">
                            <i data-lucide="file-code" class="w-4 h-4"></i>
                            <span>Export as Markdown</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Container -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-content">
                <h3 class="sidebar-heading">
                    <i data-lucide="info" class="w-5 h-5"></i>
                    API Statistics
                </h3>
                <div id="stats" class="sidebar-stats"></div>
                
                <div class="sidebar-section">
                    <h4 class="sidebar-subheading">
                        <i data-lucide="palette" class="w-4 h-4"></i>
                        Legend
                    </h4>
                    <div id="legend" class="sidebar-legend"></div>
                </div>
                
                <div class="sidebar-section">
                    <label class="sidebar-label">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        Search
                    </label>
                    <input type="text" id="searchInput" placeholder="Search nodes..." 
                        class="sidebar-input" />
                </div>

                <div id="insightsSidebar" class="sidebar-section">
                    <h4 class="sidebar-subheading">
                        <i data-lucide="lightbulb" class="w-4 h-4"></i>
                        Insights
                    </h4>
                    <div id="topDTOs" class="sidebar-insights"></div>
                    <div id="topControllers" class="sidebar-insights"></div>
                </div>
            </div>
        </aside>
        
        <!-- Main Content Area -->
        <main class="content-area">
            <!-- Mindmap View -->
            <div id="mindmapView" class="view-content active">
                <svg id="mindmap" class="w-full h-full"></svg>
            </div>
            
            <!-- Tree View -->
            <div id="treeView" class="view-content">
                <svg id="treeCanvas" class="w-full h-full"></svg>
            </div>
            
            <!-- Dependency View -->
            <div id="dependencyView" class="view-content">
                <svg id="dependencyCanvas" class="w-full h-full"></svg>
            </div>
            
            <!-- Table View -->
            <div id="tableView" class="view-content overflow-auto">
                <div class="p-6">
                    <table id="endpointsTable" class="w-full text-sm">
                        <thead class="bg-gray-50 dark:bg-gray-800">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Controller</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Method</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">HTTP</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Route</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">DTOs</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Try It</th>
                            </tr>
                        </thead>
                        <tbody id="endpointsTableBody" class="bg-white dark:bg-gray-900 divide-y divide-gray-200 dark:divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
            
            <!-- Matrix View -->
            <div id="matrixView" class="view-content overflow-auto">
                <div class="p-6">
                    <canvas id="matrixCanvas"></canvas>
                </div>
            </div>
            
            <!-- Dashboard View -->
            <div id="dashboardView" class="view-content overflow-auto">
                <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
                        <h3 class="text-lg font-semibold mb-4 text-gray-900 dark:text-white">API Overview</h3>
                        <canvas id="overviewChart"></canvas>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
                        <h3 class="text-lg font-semibold mb-4 text-gray-900 dark:text-white">Top Controllers</h3>
                        <canvas id="controllersChart"></canvas>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
                        <h3 class="text-lg font-semibold mb-4 text-gray-900 dark:text-white">HTTP Methods Distribution</h3>
                        <canvas id="methodsChart"></canvas>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
                        <h3 class="text-lg font-semibold mb-4 text-gray-900 dark:text-white">Most Used DTOs</h3>
                        <canvas id="dtosChart"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- Database Analyzer View -->
            <div id="databaseView" class="view-content">
                <svg id="databaseCanvas" class="w-full h-full"></svg>
            </div>
            
            <div id="tooltip" class="tooltip"></div>
        </main>
    </div>

    <!-- Try It Panel -->
    <div id="tryItOverlay" class="try-it-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="tryItPanelTitle">
        <div id="tryItPanel" class="try-it-panel">
            <div class="try-it-header">
                <div class="try-it-header-info">
                    <span id="tryItMethodBadge" class="try-it-method-badge">GET</span>
                    <code id="tryItRoute" class="try-it-route">/api/endpoint</code>
                </div>
                <span id="tryItPanelTitle" class="sr-only">Try API Endpoint</span>
                <button id="closeTryItBtn" class="try-it-close-btn" aria-label="Close panel (Esc)">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="try-it-tabs" role="tablist" aria-label="Request options">
                <button class="try-it-tab active" data-tab="body" role="tab" aria-selected="true" aria-controls="tryItBodyTab">Body</button>
                <button class="try-it-tab" data-tab="params" role="tab" aria-selected="false" aria-controls="tryItParamsTab">Query Params</button>
                <button class="try-it-tab" data-tab="headers" role="tab" aria-selected="false" aria-controls="tryItHeadersTab">Headers</button>
                <button class="try-it-tab" data-tab="auth" role="tab" aria-selected="false" aria-controls="tryItAuthTab">Auth</button>
                <button class="try-it-tab" data-tab="history" role="tab" aria-selected="false" aria-controls="tryItHistoryTab">History</button>
            </div>

            <div class="try-it-tab-panels">
                <!-- Body Tab -->
                <div id="tryItBodyTab" class="try-it-tab-panel" role="tabpanel">
                    <div class="try-it-field-group">
                        <label class="try-it-label" for="tryItContentType">Content-Type</label>
                        <select id="tryItContentType" class="try-it-select">
                            <option value="application/json">application/json</option>
                            <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
                            <option value="multipart/form-data">multipart/form-data</option>
                            <option value="text/plain">text/plain</option>
                        </select>
                    </div>
                    <div class="try-it-field-group">
                        <label class="try-it-label" for="tryItRequestBody">Request Body</label>
                        <textarea id="tryItRequestBody" class="try-it-textarea" placeholder="Enter request body..."></textarea>
                        <div id="tryItBodyError" class="try-it-field-error hidden"></div>
                    </div>
                </div>

                <!-- Query Params Tab -->
                <div id="tryItParamsTab" class="try-it-tab-panel hidden" role="tabpanel">
                    <div id="tryItParamsList" class="try-it-kv-list"></div>
                    <button id="tryItAddParamBtn" class="try-it-add-row-btn">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Parameter
                    </button>
                </div>

                <!-- Headers Tab -->
                <div id="tryItHeadersTab" class="try-it-tab-panel hidden" role="tabpanel">
                    <div id="tryItHeadersList" class="try-it-kv-list"></div>
                    <button id="tryItAddHeaderBtn" class="try-it-add-row-btn">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Header
                    </button>
                </div>

                <!-- Auth Tab -->
                <div id="tryItAuthTab" class="try-it-tab-panel hidden" role="tabpanel">
                    <div class="try-it-field-group">
                        <label class="try-it-label" for="tryItBearerToken">Bearer Token</label>
                        <input type="text" id="tryItBearerToken" class="try-it-input" placeholder="Enter bearer token..." autocomplete="off" />
                    </div>
                    <div class="try-it-field-group">
                        <label class="try-it-label" for="tryItBaseUrl">Base URL Override</label>
                        <input type="text" id="tryItBaseUrl" class="try-it-input" placeholder="https://api.example.com" autocomplete="off" />
                        <p class="try-it-hint">Leave empty to use the current origin.</p>
                    </div>
                </div>

                <!-- History Tab -->
                <div id="tryItHistoryTab" class="try-it-tab-panel hidden" role="tabpanel">
                    <div id="tryItHistoryList" class="try-it-history-list"></div>
                    <button id="tryItClearHistoryBtn" class="try-it-clear-history-btn">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Clear History
                    </button>
                </div>
            </div>

            <div class="try-it-actions">
                <div id="tryItValidationErrors" class="try-it-validation-errors hidden"></div>
                <button id="tryItSendBtn" class="try-it-send-btn">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>Send</span>
                </button>
            </div>

            <!-- Response Area -->
            <div id="tryItResponseArea" class="try-it-response hidden">
                <div class="try-it-response-header">
                    <span class="try-it-response-title">Response</span>
                    <div class="try-it-response-meta">
                        <span id="tryItStatusBadge" class="try-it-status-badge"></span>
                        <span id="tryItResponseTime" class="try-it-response-time"></span>
                        <button id="tryItCopyBtn" class="try-it-copy-btn" title="Copy response body">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                            <span>Copy</span>
                        </button>
                    </div>
                </div>
                <button id="tryItHeadersToggleBtn" class="try-it-headers-toggle" aria-expanded="false" aria-controls="tryItResponseHeaders">
                    <i data-lucide="chevron-right" class="w-4 h-4 try-it-chevron"></i>
                    Response Headers
                </button>
                <div id="tryItResponseHeaders" class="try-it-response-headers hidden"></div>
                <pre id="tryItResponseBody" class="try-it-response-body"></pre>
            </div>
        </div>
    </div>

    <script src="/mindmap/mindmap/mindmap.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
